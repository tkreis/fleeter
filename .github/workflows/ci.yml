name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck every shell file
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -s bash -x $(git ls-files '*.sh') fleet

  master-test:
    name: master_test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: offline master tests
        run: bash tests/master_test.sh

  master-test-debian:
    name: master_test (debian:bookworm-slim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: offline master tests in a clean Debian container
        run: |
          docker run --rm -v "$PWD:/src:ro" debian:bookworm-slim bash -c '
            apt-get update -qq >/dev/null
            apt-get install -y -qq --no-install-recommends git python3 openssh-client procps netcat-openbsd ca-certificates >/dev/null
            cd /tmp && bash /src/tests/master_test.sh'

  node-test:
    name: node_test (debian:bookworm-slim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: node-side tests in a clean Debian container
        run: docker run --rm -v "$PWD:/src:ro" debian:bookworm-slim bash /src/tests/node_test.sh

  e2e:
    name: e2e (docker master + two nodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: end-to-end with fake Tailscale and GitHub
        run: bash tests/e2e.sh
