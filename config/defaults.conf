# shellcheck shell=bash
# fleeter defaults. Shipped with the code; do not edit this file.
#
# Load order (see `fleet_load_config` in lib/common.sh):
#   1. this file
#   2. $FLEET_HOME/fleet.conf          (~/.config/fleet/fleet.conf, per machine; may set FLEET_CONFIG_DIR)
#   3. $FLEET_CONFIG_DIR/fleet.conf    (your private fleet-config repo)
#   4. $FLEET_HOME/fleet.conf again    (so a local override always wins)
#
# Put your values in your fleet-config repo (start from examples/fleet-config).

# ---------- repos (SSH URLs; https is accepted for a public code repo) ----------
# Empty here on purpose. init master and enrolment need FLEET_CONFIG_REPO; the
# other two are optional: no code repo = provision re-ships the code each time,
# no memory repo = shared memory off (no memory deploy key, clone or timer).
FLEET_CODE_REPO=""        # this tool (fleeter). Nodes pull it with the read-only key ~/.ssh/fleet_code (skipped for https URLs)
FLEET_CONFIG_REPO=""      # your private config repo (AGENTS.md, harness/, skills/, fleet.conf). Read-only key ~/.ssh/fleet_config
FLEET_MEMORY_REPO=""      # your private shared-memory vault. Read-write key ~/.ssh/fleet_memory
FLEET_MEMORY_DIR="$HOME/fleet-memory"

# ---------- Tailscale ----------
FLEET_NODE_TAG="tag:fleet-node"
FLEET_HOSTNAME_PREFIX="fleet-"

# ---------- tools ----------
# Tools converged on every node, in order. Each is lib/tools/<name>.sh. Presets:
#   minimal  base devtools claude                              (this default)
#   agents   base devtools claude codex cursor chrome
#   full     base devtools claude codex cursor chrome grok cliproxy t3code
FLEET_TOOLS="base devtools claude"
# Tools skipped inside containers (no GUI, no nested docker).
FLEET_TOOLS_SKIP_IN_CONTAINER="t3code"

# devtools: language runtimes via mise (space-separated mise specs), optional pnpm
# via corepack (empty = skip), optional global npm packages, optional registry logins.
FLEET_MISE_TOOLS="node@lts"
FLEET_PNPM=""
FLEET_NPM_GLOBALS=""
# Space-separated `host=USER_VAR:TOKEN_VAR` entries. USER_VAR and TOKEN_VAR name
# variables in the node's environment (fleet secrets); values never touch argv.
# Example: FLEET_DOCKER_LOGINS="registry.example.com=REGISTRY_USER:REGISTRY_TOKEN"
FLEET_DOCKER_LOGINS=""

# chrome: browser MCP servers pinned by version (npm -g through mise's node).
FLEET_CHROME_DEVTOOLS_MCP="1.10.1"   # chrome-devtools-mcp
FLEET_PLAYWRIGHT_MCP="0.0.83"        # @playwright/mcp

# cliproxy: local = run CLIProxyAPI on every node; remote = only use FLEET_PROXY_URL.
FLEET_PROXY_MODE="local"
FLEET_PROXY_URL="http://127.0.0.1:8317"       # what the harnesses get as ANTHROPIC_BASE_URL; keep the port in step with FLEET_PROXY_PORT
FLEET_PROXY_IMAGE="eceasy/cli-proxy-api:latest"
FLEET_PROXY_TZ="UTC"                          # TZ inside the proxy container (log timestamps), e.g. Europe/Berlin
FLEET_PROXY_CONTAINER="cli-proxy-api"         # docker container name
FLEET_PROXY_PORT="8317"                       # host port on 127.0.0.1 the container is published on
FLEET_CLIPROXY_DIR="$HOME/cli-proxy-api"      # compose dir on nodes; default source dir for `fleet proxy import`

# ---------- harness capture (fleet config publish) ----------
# Skills never captured into the config repo (plus the built-in `synced`, `.system`).
FLEET_SKILL_EXCLUDE=""
# Extra markers that make an MCP server / hook machine-only (dropped on capture),
# in addition to /Applications, /Library/Application Support, 127.0.0.1, localhost.
FLEET_CAPTURE_MACHINE_ONLY=""
# Claude agent files (basename without .md) never captured, and `;`-separated
# text markers that exclude an agent file when found in it.
FLEET_CAPTURE_AGENT_EXCLUDE=""
FLEET_CAPTURE_AGENT_MARKERS=""
# Extra words that drop a Codex `prefix_rule` as machine/project specific.
FLEET_CAPTURE_RULE_DROP=""

# ---------- T3 Code remote access (fleet t3 ...) ----------
# 1 = init master creates the restricted T3 client key, so every provisioned
# node gets its authorized_keys line and ~/.ssh/config.d/fleet is maintained.
# 0 = nothing of that until you run `fleet t3 setup` yourself.
FLEET_T3_REMOTE=0

# ---------- schedules (minutes) ----------
FLEET_PULL_EVERY=15
FLEET_MEMORY_EVERY=5
FLEET_UPDATE_EVERY=1440
FLEET_RECONCILE_EVERY=2
# fleet sync on the master: fast-forward the code and config checkouts, reconcile,
# and every FLEET_PUSH_TOOLS_EVERY minutes run `fleet update` on the online nodes
# (0 = never push tool updates from the master; nodes still run their own update timer).
FLEET_SYNC_EVERY=30
FLEET_PUSH_TOOLS_EVERY=1440
# 1 = fleet sync publishes skills installed in the master's harness skill dirs
# (~/.claude/skills, ~/.agents/skills, ~/.codex/skills, ~/.cursor/skills) that the
# config repo lacks or has in another version: copied in, secret-scanned, committed
# (`publish skills: a, b`), pushed. Never removes a skill from the repo. 0 = off.
FLEET_SYNC_PUBLISH_SKILLS=1
# Hours a registered (non-ephemeral) node may be missing from the tailnet device
# list before reconcile revokes its deploy keys. Ephemeral nodes: fixed 1 hour.
FLEET_MISSING_GRACE_HOURS=24

# ---------- secret profiles ----------
FLEET_DEFAULT_PROFILE="full"
FLEET_EPHEMERAL_PROFILE="minimal"

# ---------- vault encryption at rest (master; lib/vault.sh) ----------
# FLEET_VAULT_KEY_BACKEND: where the vault's private age key lives.
#   keychain     macOS login keychain (service fleet-vault, account $USER); default on macOS
#   secret-tool  libsecret / GNOME Keyring; default on Linux when `secret-tool` is installed
#   file         ~/.config/fleet/vault.key (0600, outside vault/); fallback and CI
# Not assigned here on purpose: unset means "pick by platform", and the environment or
# ~/.config/fleet/fleet.conf (a per-machine choice) sets it. Keep it constant once the
# key exists; `fleet vault status` shows the backend the key was created with.
