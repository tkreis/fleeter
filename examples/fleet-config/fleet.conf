# shellcheck shell=bash
# fleet.conf — your fleet's settings. Lives in your private fleet-config repo and
# is read on the master and on every node after config/defaults.conf (fleeter)
# and before ~/.config/fleet/fleet.conf (per-machine overrides, which win).
# Every key and its default is documented in fleeter's README ("Config reference");
# a key you leave out keeps the default from config/defaults.conf.

# ---------- repos ----------
# SSH URLs. Replace YOU with your GitHub user or organisation. Nodes reach them
# through per-node deploy keys registered by the master during enrolment.
FLEET_CODE_REPO="git@github.com:YOU/fleeter.git"          # or https://github.com/YOU/fleeter.git for a public fork (no key)
FLEET_CONFIG_REPO="git@github.com:YOU/fleet-config.git"   # this repo (private)
FLEET_MEMORY_REPO="git@github.com:YOU/fleet-memory.git"   # shared memory vault (private; create it from fleeter's templates/memory). Empty = shared memory off
FLEET_MEMORY_DIR="$HOME/fleet-memory"
FLEET_MASTER_NAME=""                                       # the master's folder in the vault (nodes/<name>); empty = short hostname

# ---------- shared memory capture (what fleet memory sync uploads from every machine) ----------
FLEET_MEMORY_CAPTURE="claude codex grok"                   # native agent memories mirrored into nodes/<name>/<source>/; "" = off
FLEET_MEMORY_CAPTURE_EXCLUDE="*Library-Application-Support-Claude-scratch*"   # globs (source-relative path) never uploaded
FLEET_MEMORY_MAX_KB=256                                    # larger files are skipped

# ---------- Tailscale ----------
FLEET_NODE_TAG="tag:fleet-node"
FLEET_HOSTNAME_PREFIX="fleet-"

# ---------- tools on every node, in install order (lib/tools/<name>.sh) ----------
# Presets (pick one, then add or drop single plug-ins; see README "Choosing tools"):
#   minimal  base devtools claude
#   agents   base devtools claude codex cursor chrome
#   full     base devtools claude codex cursor chrome grok cliproxy t3code
FLEET_TOOLS="base devtools claude"
FLEET_TOOLS_SKIP_IN_CONTAINER="t3code"

# devtools
FLEET_MISE_TOOLS="node@lts"      # e.g. "node@24 java@temurin-25 python@3.13"
FLEET_PNPM=""                    # e.g. "10.12.1" (activated through corepack); empty = skip
FLEET_NPM_GLOBALS=""             # e.g. "@bitbonsai/mcpvault"
FLEET_DOCKER_LOGINS=""           # e.g. "registry.example.com=REGISTRY_USER:REGISTRY_TOKEN" (both set with fleet secrets set)

# chrome: browser MCP server pins (npm)
FLEET_CHROME_DEVTOOLS_MCP="1.10.1"
FLEET_PLAYWRIGHT_MCP="0.0.83"

# cliproxy: local = every node runs its own CLIProxyAPI (config + logins come
# from the master via `fleet proxy import`); remote = only use FLEET_PROXY_URL
FLEET_PROXY_MODE="local"
FLEET_PROXY_URL="http://127.0.0.1:8317"
FLEET_PROXY_IMAGE="eceasy/cli-proxy-api:latest"
FLEET_PROXY_TZ="UTC"                       # timezone inside the proxy container
FLEET_PROXY_CONTAINER="cli-proxy-api"
FLEET_PROXY_PORT="8317"                    # keep FLEET_PROXY_URL in step
FLEET_CLIPROXY_DIR="$HOME/cli-proxy-api"

# ---------- AWS SSO credentials on the nodes (fleet aws push / fleet sync) ----------
# Allowlist of profiles from the master's ~/.aws/config whose short-lived role
# credentials go to the nodes; empty = none, ever. The SSO session token stays
# on the master. Never list a production profile: FLEET_AWS_DENY refuses
# anything matching *prod* *production* *prd* (name, account id, role name,
# role_arn) even if it is listed here.
FLEET_AWS_PROFILES=""                      # e.g. "dev"
FLEET_AWS_DENY="*prod* *production* *prd*" # shell globs, case-insensitive; cannot be bypassed by a flag
FLEET_AWS_ACCOUNTS=""                      # optional: only these sso_account_ids may be forwarded, e.g. "111122223333"
FLEET_AWS_SYNC=1                           # fleet sync pushes fresh credentials (never logs in); 0 = only fleet aws push by hand
FLEET_AWS_REFRESH_MINUTES=60               # sync pushes again after this many minutes, or when what it pushed expires sooner
FLEET_AWS_CLI=1                            # devtools installs the aws CLI on the nodes (brew / official installer into ~/.local)

# ---------- T3 Code remote access (fleet t3 setup|status|revoke) ----------
FLEET_T3_REMOTE=0                          # 1 = init master prepares the T3 client key for every node

# ---------- capture (fleet config publish) ----------
FLEET_SKILL_EXCLUDE=""                 # skills on the master that must not be shipped (space separated)
FLEET_CAPTURE_MACHINE_ONLY=""          # extra words marking an MCP server/hook as machine-only
FLEET_CAPTURE_AGENT_EXCLUDE=""         # Claude agent files not shipped (basename without .md)
FLEET_CAPTURE_AGENT_MARKERS=""         # `;`-separated text markers that exclude an agent file
FLEET_CAPTURE_RULE_DROP=""             # extra words that drop a Codex prefix_rule

# ---------- keep nodes awake ----------
FLEET_KEEP_AWAKE=1                         # nodes never system-sleep (macOS caffeinate agent + pmset -c, Linux masked sleep targets); master and containers excepted

# ---------- schedules (minutes) and grace ----------
FLEET_PULL_EVERY=15
FLEET_MEMORY_EVERY=5
FLEET_UPDATE_EVERY=1440
FLEET_RECONCILE_EVERY=2
FLEET_SYNC_EVERY=30                        # master: fast-forward checkouts + reconcile (fleet sync)
FLEET_PUSH_TOOLS_EVERY=1440                # master: `fleet update` on the online nodes from fleet sync; 0 = off
FLEET_MISSING_GRACE_HOURS=24

# ---------- secret profiles ----------
FLEET_DEFAULT_PROFILE="full"
FLEET_EPHEMERAL_PROFILE="minimal"
