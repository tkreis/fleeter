# shellcheck shell=bash
# fleet.conf — your fleet's settings. Lives in your private fleet-config repo and
# is read on the master and on every node after config/defaults.conf (fleeter)
# and before ~/.config/fleet/fleet.conf (per-machine overrides, which win).
# Every key and its default is documented in fleeter's README ("Configuration").

# ---------- repos ----------
# SSH URLs. Replace YOU with your GitHub user or organisation. Nodes reach them
# through per-node deploy keys registered by the master during enrolment.
FLEET_CODE_REPO="git@github.com:YOU/fleeter.git"          # or https://github.com/YOU/fleeter.git for a public fork (no key)
FLEET_CONFIG_REPO="git@github.com:YOU/fleet-config.git"   # this repo (private)
FLEET_MEMORY_REPO="git@github.com:YOU/fleet-memory.git"   # shared memory vault (private; create it from fleeter's templates/memory)
FLEET_MEMORY_DIR="$HOME/fleet-memory"

# ---------- Tailscale ----------
FLEET_NODE_TAG="tag:fleet-node"
FLEET_HOSTNAME_PREFIX="fleet-"

# ---------- tools on every node, in install order (lib/tools/<name>.sh) ----------
# Full set: base devtools chrome claude codex cursor grok cliproxy t3code
FLEET_TOOLS="base devtools chrome claude codex"
FLEET_TOOLS_SKIP_IN_CONTAINER="t3code"

# devtools
FLEET_MISE_TOOLS="node@lts"      # e.g. "node@24 java@temurin-25 python@3.13"
FLEET_PNPM=""                    # e.g. "10.12.1" (activated through corepack); empty = skip
FLEET_NPM_GLOBALS=""             # e.g. "@bitbonsai/mcpvault"
FLEET_DOCKER_LOGINS=""           # e.g. "registry.example.com=REGISTRY_USER:REGISTRY_TOKEN" (both set with fleet secrets set)

# chrome: browser MCP server pins (npm)
FLEET_CHROME_DEVTOOLS_MCP="1.10.1"
FLEET_PLAYWRIGHT_MCP="0.0.83"

# cliproxy: local = every node runs its own CLIProxyAPI (config + logins come
# from the master via `fleet proxy import`); remote = only use FLEET_PROXY_URL
FLEET_PROXY_MODE="local"
FLEET_PROXY_URL="http://127.0.0.1:8317"
FLEET_PROXY_IMAGE="eceasy/cli-proxy-api:latest"

# ---------- capture (fleet config publish) ----------
FLEET_SKILL_EXCLUDE=""                 # skills on the master that must not be shipped (space separated)
FLEET_CAPTURE_MACHINE_ONLY=""          # extra words marking an MCP server/hook as machine-only
FLEET_CAPTURE_AGENT_EXCLUDE=""         # Claude agent files not shipped (basename without .md)
FLEET_CAPTURE_AGENT_MARKERS=""         # `;`-separated text markers that exclude an agent file
FLEET_CAPTURE_RULE_DROP=""             # extra words that drop a Codex prefix_rule

# ---------- schedules (minutes) and grace ----------
FLEET_PULL_EVERY=15
FLEET_MEMORY_EVERY=5
FLEET_UPDATE_EVERY=1440
FLEET_RECONCILE_EVERY=2
FLEET_MISSING_GRACE_HOURS=24

# ---------- secret profiles ----------
FLEET_DEFAULT_PROFILE="full"
FLEET_EPHEMERAL_PROFILE="minimal"
